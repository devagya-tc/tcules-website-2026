<text x="314" y="536" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="49" fill="#2B323D"><tspan x="314" dy="0">An AI feature people can check,</tspan><tspan x="314" dy="71">correct and undo: the AI's suggestion</tspan><tspan x="314" dy="71">held apart from the user's own work,</tspan><tspan x="314" dy="71">the evidence behind it shown, and a</tspan><tspan x="314" dy="71">person editing or undoing it before it</tspan><tspan x="314" dy="71">is accepted.</tspan></text>
