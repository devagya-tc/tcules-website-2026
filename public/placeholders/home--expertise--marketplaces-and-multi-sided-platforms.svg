<text x="458" y="379" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" fill="#2B323D"><tspan x="458" dy="0">Marketplaces and multi-sided</tspan><tspan x="458" dy="49">platforms: two sides of one platform —</tspan><tspan x="458" dy="49">a buyer's and a seller's view of the</tspan><tspan x="458" dy="49">same listing, booking or order —</tspan><tspan x="458" dy="49">joined by the shared record between</tspan><tspan x="458" dy="49">them.</tspan></text>
