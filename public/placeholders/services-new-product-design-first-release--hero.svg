<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1280" width="1600" height="1280" role="img" aria-label="Image to come · illustration">
<rect width="1600" height="1280" fill="#EEF0F3"/>
<rect x="1" y="1" width="1598" height="1278" fill="none" stroke="#BFC5CF" stroke-width="2" stroke-dasharray="38 38"/>
<text x="314" y="428" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="38" letter-spacing="3.8" fill="#4A5361">IMAGE TO COME · ILLUSTRATION</text>
<text x="314" y="536" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="49" fill="#2B323D"><tspan x="314" dy="0">What the first release must do, and</tspan><tspan x="314" dy="71">what it leaves out: the few jobs the</tspan><tspan x="314" dy="71">first paying customer needs carried</tspan><tspan x="314" dy="71">into the release, the rest set aside</tspan><tspan x="314" dy="71">for the second, then designed, built</tspan><tspan x="314" dy="71">and launched.</tspan></text>
</svg>
