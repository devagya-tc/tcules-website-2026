<text x="314" y="500" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="49" fill="#2B323D"><tspan x="314" dy="0">Patient, clinician, carer, healthcare</tspan><tspan x="314" dy="71">professional and operations team each</tspan><tspan x="314" dy="71">seeing their own view of one shared</tspan><tspan x="314" dy="71">case, with records and bookings</tspan><tspan x="314" dy="71">arriving from connected systems and</tspan><tspan x="314" dy="71">specialist rules framing what each may</tspan><tspan x="314" dy="71">see.</tspan></text>
