# Run the repo's own checks on every pull request, and on main.
#
# Why this exists: the six checks in `npm run verify` are the difference between "it compiles" and
# "it follows the system", and until now they only ran where someone remembered to type them. It
# makes the answer visible on the pull request, which is what lets someone who is not the repo owner
# open one with confidence and get told they are wrong by a machine rather than by a person. `main`
# is protected (public repo, 20 Oct 2026) but this check is not yet a REQUIRED one, so a red run
# still does not block a merge.
#
# It deliberately does not run `npm run build`, `npm run aria:check` or `npm run format`. The first
# two need a browser build and belong to the person shipping an interactive component; the third
# writes files, and a formatter that edits code in CI is how a diff stops matching what its author
# reviewed.
#
# It does not need a build to typecheck either, and that is now true rather than assumed. Next 16's
# route-aware helpers — `PageProps<'/audits/[slug]'>`, `LayoutProps`, `RouteContext` — are GENERATED
# globals, written into `.next/types` by `next dev`, `next build` or `next typegen`. A `tsc --noEmit`
# with no `.next` cannot see them, so `main` went red the moment the first typed-route page landed
# (25 Aug 2026, `src/app/audits/[slug]/page.tsx`): it typechecked on its author's machine, where a
# dev server had already generated the types, and nowhere else. `npm run typecheck` therefore runs
# `next typegen` first — half a second, no bundle — which fixes a fresh clone as well as this
# workflow. Do not "fix" a `Cannot find name 'PageProps'` by hand-writing the params type.
name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # engines in package.json sets the floor at >=20.11.1; 22 is the current LTS above it.
          node-version: '22'
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the committed lockfile and fails if
      # package.json and the lockfile disagree, which is a real failure and not something to paper
      # over in CI.
      - run: npm ci

      - name: npm run verify
        run: npm run verify
